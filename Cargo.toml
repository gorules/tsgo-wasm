[package]
name = "tsgo-wasm"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "typescript-go (tsgo) compiled to WASI p1, with an optional wasmtime runtime"
repository = "https://github.com/gorules/tsgo-wasm"
homepage = "https://gorules.io"
documentation = "https://docs.rs/tsgo-wasm"
keywords = ["typescript", "tsgo", "wasm", "wasi", "wasmtime"]
categories = ["development-tools", "wasm", "compilers"]

[features]
default = ["runtime"]
runtime = ["dep:anyhow", "dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
zstd = "0.13"
anyhow = { version = "1", optional = true }
wasmtime = { version = "47", optional = true }
wasmtime-wasi = { version = "47", optional = true }

[build-dependencies]
sha2 = "0.10"
ureq = "2"

[dev-dependencies]
zstd = "0.13"
